[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freight-rate"
version = "0.1.0"
description = "Freight load rate prediction (Spotter Labs ML assessment)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0,<3",
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.5,<1.8",
    "pyyaml>=6,<7",
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.5",
    "ipykernel>=6.29,<8",
    "nbconvert>=7.16,<8",
    "nbformat>=5.10,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["score.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Report prose: long f-strings read better unwrapped.
"src/freight_rate/reporting/build_report.py" = ["E501"]
